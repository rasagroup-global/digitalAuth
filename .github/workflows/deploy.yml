name: Centralized Deployment SSO (Keycloak 26)

on:
  push:
    branches:
      - 'dev*'
      - 'qa'
      - 'staging'
      - 'main'
      - 'master'

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_deploy-ssh.yml
    with:
      target_env: prod
    secrets:
      DO_HOST: ${{ secrets.PROD_DO_HOST }}
      DO_SSH_KEY: ${{ secrets.PROD_DO_SSH_KEY }}
      DO_USERNAME: ${{ secrets.PROD_DO_USERNAME }}
      DO_PASSWORD: ${{ secrets.PROD_DO_PASSWORD }}
      DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      KC_ADMIN_USERNAME: ${{ secrets.PROD_KC_ADMIN_USERNAME || secrets.KC_ADMIN_USERNAME }}
      KC_ADMIN_PASSWORD: ${{ secrets.PROD_KC_ADMIN_PASSWORD || secrets.KC_ADMIN_PASSWORD }}
      KEYCLOAK_API_CLIENT_SECRET: ${{ secrets.PROD_KEYCLOAK_API_CLIENT_SECRET || secrets.KEYCLOAK_API_CLIENT_SECRET }}
      KEYCLOAK_CMS_CLIENT_SECRET: ${{ secrets.PROD_KEYCLOAK_CMS_CLIENT_SECRET || secrets.KEYCLOAK_CMS_CLIENT_SECRET }}
      KEYCLOAK_COMMERCE_CLIENT_SECRET: ${{ secrets.PROD_KEYCLOAK_COMMERCE_CLIENT_SECRET || secrets.KEYCLOAK_COMMERCE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}

  deploy-dev:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    uses: ./.github/workflows/_deploy-ssh.yml
    with:
      target_env: dev-qa
    secrets:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      DO_USERNAME: ${{ secrets.DO_USERNAME }}
      DO_PASSWORD: ${{ secrets.DO_PASSWORD }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KC_ADMIN_USERNAME: ${{ secrets.KC_ADMIN_USERNAME }}
      KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
      KEYCLOAK_API_CLIENT_SECRET: ${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}
      KEYCLOAK_CMS_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CMS_CLIENT_SECRET }}
      KEYCLOAK_COMMERCE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_COMMERCE_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
