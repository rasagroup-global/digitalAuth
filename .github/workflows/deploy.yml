name: Centralized Deployment SSO (Keycloak 26)

on:
  push:
    branches:
      - 'dev*'
      - 'qa'
      - 'staging'
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Keycloak Container & Reverse Proxy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            BRANCH=${{ github.ref_name }}
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
                DOMAIN="sso.rasagroup.global"
                KC_DB_NAME="keycloak_db_prod"
                CONTAINER_NAME="sso-main-app"
                PROJECT_NAME="sso-main"
            elif [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "qa" ]; then
                DOMAIN="sso-$BRANCH.rasagroup.global"
                KC_DB_NAME="keycloak_db_staging"
                CONTAINER_NAME="sso-$BRANCH-app"
                PROJECT_NAME="sso-$BRANCH"
            else
                DOMAIN="sso-dev.rasagroup.global"
                KC_DB_NAME="keycloak_db_dev"
                CONTAINER_NAME="sso-dev-app"
                PROJECT_NAME="sso-dev"
            fi

            TARGET_DIR=/var/www/RASA/AUTH/$BRANCH
            PROXY_CONF=/var/www/RASA/INFRA/conf.d/$PROJECT_NAME.conf

            mkdir -p /var/www/RASA/AUTH

            # 0. Sync repository langsung via Git di VPS
            if [ -d "$TARGET_DIR/.git" ]; then
                cd $TARGET_DIR
                git fetch origin $BRANCH
                git checkout $BRANCH || git checkout -b $BRANCH origin/$BRANCH
                git reset --hard origin/$BRANCH
            else
                rm -rf $TARGET_DIR
                git clone --branch $BRANCH $REPO_URL $TARGET_DIR
                cd $TARGET_DIR
            fi

            # 1. Pastikan script menggunakan LF line-endings & database PostgreSQL untuk Keycloak tersedia di api-shared-db
            sed -i 's/\r$//' scripts/*.sh || true
            chmod +x scripts/*.sh || true
            DB_USER="${{ secrets.DB_USERNAME }}"
            [ -z "$DB_USER" ] && DB_USER="postgres"
            bash scripts/init-keycloak-db.sh "$KC_DB_NAME" "$DB_USER"

            # 2. Generate .env
            KC_ADMIN_USER="${{ secrets.KC_ADMIN_USERNAME }}"
            [ -z "$KC_ADMIN_USER" ] && KC_ADMIN_USER="admin"

            KC_ADMIN_PASS="${{ secrets.KC_ADMIN_PASSWORD }}"
            [ -z "$KC_ADMIN_PASS" ] && KC_ADMIN_PASS="RasaSsoAdmin2026!"

            API_SECRET="${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}"
            [ -z "$API_SECRET" ] && API_SECRET="rasa-api-secret-dev-2026"

            CMS_SECRET="${{ secrets.KEYCLOAK_CMS_CLIENT_SECRET }}"
            [ -z "$CMS_SECRET" ] && CMS_SECRET="rasa-cms-secret-dev-2026"

            COMMERCE_SECRET="${{ secrets.KEYCLOAK_COMMERCE_CLIENT_SECRET }}"
            [ -z "$COMMERCE_SECRET" ] && COMMERCE_SECRET="rasa-commerce-secret-dev-2026"

            echo "PROJECT_NAME=$PROJECT_NAME" > .env
            echo "DOCKER_TAG=26.0" >> .env
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=$KC_ADMIN_USER" >> .env
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_ADMIN_PASS" >> .env
            echo "KC_HOSTNAME=https://$DOMAIN" >> .env
            echo "KC_HOSTNAME_STRICT=false" >> .env
            echo "KC_HTTP_ENABLED=true" >> .env
            echo "KC_PROXY_HEADERS=xforwarded" >> .env
            echo "KC_HEALTH_ENABLED=true" >> .env
            echo "KC_DB=postgres" >> .env
            echo "KC_DB_URL_HOST=api-shared-db" >> .env
            echo "KC_DB_URL_PORT=5432" >> .env
            echo "KC_DB_URL_DATABASE=$KC_DB_NAME" >> .env
            echo "KC_DB_USERNAME=$DB_USER" >> .env
            echo "KC_DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "KEYCLOAK_REALM=rasa" >> .env
            echo "KEYCLOAK_API_CLIENT_SECRET=$API_SECRET" >> .env
            echo "KEYCLOAK_CMS_CLIENT_SECRET=$CMS_SECRET" >> .env
            echo "KEYCLOAK_COMMERCE_CLIENT_SECRET=$COMMERCE_SECRET" >> .env
            echo "JAVA_OPTS_APPEND=-Xms256m -Xmx640m" >> .env

            # 3. Jalankan container Keycloak
            docker compose --project-name $PROJECT_NAME up -d --force-recreate
            sleep 5
            echo "==> Status & Log Awal Container $CONTAINER_NAME:"
            docker ps -a --filter "name=$CONTAINER_NAME"
            docker logs --tail 40 $CONTAINER_NAME || true

            # 4. Deteksi otomatis path mount ACME Challenge pada container rasa-shared-proxy
            ACME_HOST_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/letsencrypt"}}{{.Source}}{{end}}{{end}}' rasa-shared-proxy 2>/dev/null || echo "")
            ACME_CONTAINER_DIR="/var/lib/letsencrypt"

            if [ -z "$ACME_HOST_DIR" ]; then
              ACME_HOST_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/www/certbot"}}{{.Source}}{{end}}{{end}}' rasa-shared-proxy 2>/dev/null || echo "")
              if [ -n "$ACME_HOST_DIR" ]; then
                ACME_CONTAINER_DIR="/var/www/certbot"
              fi
            fi

            if [ -z "$ACME_HOST_DIR" ]; then
              ACME_HOST_DIR="/var/www/RASA/INFRA/certbot/www"
              ACME_CONTAINER_DIR="/var/lib/letsencrypt"
            fi

            CERT_HOST_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/etc/letsencrypt"}}{{.Source}}{{end}}{{end}}' rasa-shared-proxy 2>/dev/null || echo "")
            if [ -z "$CERT_HOST_DIR" ]; then
              CERT_HOST_DIR="/var/www/RASA/INFRA/certbot/conf"
            fi

            mkdir -p "$ACME_HOST_DIR/.well-known/acme-challenge"
            chmod -R 755 "$ACME_HOST_DIR"

            # 5. Request SSL Certbot jika belum ada
            if [ ! -f "$CERT_HOST_DIR/live/$DOMAIN/fullchain.pem" ]; then
              echo "server {" > $PROXY_CONF
              echo "    listen 80;" >> $PROXY_CONF
              echo "    server_name $DOMAIN;" >> $PROXY_CONF
              echo "    location ^~ /.well-known/acme-challenge/ {" >> $PROXY_CONF
              echo "        default_type \"text/plain\";" >> $PROXY_CONF
              echo "        root $ACME_CONTAINER_DIR;" >> $PROXY_CONF
              echo "    }" >> $PROXY_CONF
              echo "    location / { return 301 https://\$host\$request_uri; }" >> $PROXY_CONF
              echo "}" >> $PROXY_CONF

              docker exec rasa-shared-proxy nginx -t && docker exec rasa-shared-proxy nginx -s reload
              sleep 2

              docker run --rm \
                -v "$CERT_HOST_DIR:/etc/letsencrypt" \
                -v "$ACME_HOST_DIR:$ACME_CONTAINER_DIR" \
                certbot/certbot certonly --webroot \
                --webroot-path=$ACME_CONTAINER_DIR \
                --email admin@rasagroup.global --agree-tos --no-eff-email \
                -d $DOMAIN || true
            fi

            # Fallback ke Wildcard / Existing Certificate jika masih belum terbit (misal rate-limit / mount custom)
            SSL_CERT="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/$DOMAIN/privkey.pem"
            if [ ! -f "$CERT_HOST_DIR/live/$DOMAIN/fullchain.pem" ]; then
              FALLBACK_DOMAIN=$(ls -1 "$CERT_HOST_DIR/live" 2>/dev/null | grep -v "README" | head -n 1 || echo "")
              if [ -n "$FALLBACK_DOMAIN" ]; then
                echo "WARNING: Cert for $DOMAIN not found, falling back to $FALLBACK_DOMAIN cert temporarily"
                SSL_CERT="/etc/letsencrypt/live/$FALLBACK_DOMAIN/fullchain.pem"
                SSL_KEY="/etc/letsencrypt/live/$FALLBACK_DOMAIN/privkey.pem"
              fi
            fi

            # 6. Update Nginx Proxy ke HTTPS Reverse Proxy Keycloak
            echo "server {" > $PROXY_CONF
            echo "    listen 80;" >> $PROXY_CONF
            echo "    server_name $DOMAIN;" >> $PROXY_CONF
            echo "    location ^~ /.well-known/acme-challenge/ {" >> $PROXY_CONF
            echo "        default_type \"text/plain\";" >> $PROXY_CONF
            echo "        root $ACME_CONTAINER_DIR;" >> $PROXY_CONF
            echo "    }" >> $PROXY_CONF
            echo "    location / { return 301 https://\$host\$request_uri; }" >> $PROXY_CONF
            echo "}" >> $PROXY_CONF
            echo "server {" >> $PROXY_CONF
            echo "    listen 443 ssl;" >> $PROXY_CONF
            echo "    server_name $DOMAIN;" >> $PROXY_CONF
            echo "    ssl_certificate $SSL_CERT;" >> $PROXY_CONF
            echo "    ssl_certificate_key $SSL_KEY;" >> $PROXY_CONF
            echo "    include /etc/nginx/conf.d/proxy_params;" >> $PROXY_CONF
            echo "    client_max_body_size 20M;" >> $PROXY_CONF
            echo "    proxy_buffer_size 128k;" >> $PROXY_CONF
            echo "    proxy_buffers 8 256k;" >> $PROXY_CONF
            echo "    proxy_busy_buffers_size 256k;" >> $PROXY_CONF
            echo "    large_client_header_buffers 4 32k;" >> $PROXY_CONF
            echo "    location / {" >> $PROXY_CONF
            echo "        proxy_pass http://$CONTAINER_NAME:8080;" >> $PROXY_CONF
            echo "        proxy_http_version 1.1;" >> $PROXY_CONF
            echo "        proxy_set_header Host \$host;" >> $PROXY_CONF
            echo "        proxy_set_header X-Real-IP \$remote_addr;" >> $PROXY_CONF
            echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" >> $PROXY_CONF
            echo "        proxy_set_header X-Forwarded-Proto https;" >> $PROXY_CONF
            echo "        proxy_set_header X-Forwarded-Host \$host;" >> $PROXY_CONF
            echo "        proxy_set_header X-Forwarded-Port 443;" >> $PROXY_CONF
            echo "        proxy_read_timeout 120s;" >> $PROXY_CONF
            echo "    }" >> $PROXY_CONF
            echo "}" >> $PROXY_CONF

            docker exec rasa-shared-proxy nginx -t && docker exec rasa-shared-proxy nginx -s reload
            echo "Deployment Rasa SSO ($DOMAIN) selesai!"
