name: Centralized Deployment SSO (Keycloak 26)

on:
  push:
    branches:
      - 'dev*'
      - 'qa'
      - 'staging'
      - 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "realms,themes,config,scripts,docker-compose.yml,.env.example"
          target: "/var/www/RASA/AUTH/${{ github.ref_name }}"

      - name: Deploy Keycloak Container & Reverse Proxy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            BRANCH=${{ github.ref_name }}

            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
                DOMAIN="sso.rasagroup.global"
                KC_DB_NAME="keycloak_db_prod"
                CONTAINER_NAME="sso-main-app"
                PROJECT_NAME="sso-main"
            elif [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "qa" ]; then
                DOMAIN="sso-$BRANCH.rasagroup.global"
                KC_DB_NAME="keycloak_db_staging"
                CONTAINER_NAME="sso-$BRANCH-app"
                PROJECT_NAME="sso-$BRANCH"
            else
                DOMAIN="sso-dev.rasagroup.global"
                KC_DB_NAME="keycloak_db_dev"
                CONTAINER_NAME="sso-dev-app"
                PROJECT_NAME="sso-dev"
            fi

            TARGET_DIR=/var/www/RASA/AUTH/$BRANCH
            PROXY_CONF=/var/www/RASA/INFRA/conf.d/$PROJECT_NAME.conf

            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # 1. Pastikan Database PostgreSQL untuk Keycloak sudah tersedia di api-shared-db
            chmod +x scripts/*.sh || true
            bash scripts/init-keycloak-db.sh "$KC_DB_NAME" "${{ secrets.DB_USERNAME || 'postgres' }}"

            # 2. Generate .env
            KC_ADMIN_USER="${{ secrets.KC_ADMIN_USERNAME }}"
            [ -z "$KC_ADMIN_USER" ] && KC_ADMIN_USER="admin"

            KC_ADMIN_PASS="${{ secrets.KC_ADMIN_PASSWORD }}"
            [ -z "$KC_ADMIN_PASS" ] && KC_ADMIN_PASS="RasaSsoAdmin2026!"

            API_SECRET="${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}"
            [ -z "$API_SECRET" ] && API_SECRET="rasa-api-secret-dev-2026"

            CMS_SECRET="${{ secrets.KEYCLOAK_CMS_CLIENT_SECRET }}"
            [ -z "$CMS_SECRET" ] && CMS_SECRET="rasa-cms-secret-dev-2026"

            COMMERCE_SECRET="${{ secrets.KEYCLOAK_COMMERCE_CLIENT_SECRET }}"
            [ -z "$COMMERCE_SECRET" ] && COMMERCE_SECRET="rasa-commerce-secret-dev-2026"

            cat > .env <<EOF
            PROJECT_NAME=$PROJECT_NAME
            DOCKER_TAG=26.0
            KC_BOOTSTRAP_ADMIN_USERNAME=$KC_ADMIN_USER
            KC_BOOTSTRAP_ADMIN_PASSWORD=$KC_ADMIN_PASS
            KC_HOSTNAME=https://$DOMAIN
            KC_HOSTNAME_STRICT=false
            KC_HTTP_ENABLED=true
            KC_PROXY_HEADERS=xforwarded
            KC_HEALTH_ENABLED=true
            KC_DB=postgres
            KC_DB_URL_HOST=api-shared-db
            KC_DB_URL_PORT=5432
            KC_DB_URL_DATABASE=$KC_DB_NAME
            KC_DB_USERNAME=${{ secrets.DB_USERNAME }}
            KC_DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            KEYCLOAK_REALM=rasa
            KEYCLOAK_API_CLIENT_SECRET=$API_SECRET
            KEYCLOAK_CMS_CLIENT_SECRET=$CMS_SECRET
            KEYCLOAK_COMMERCE_CLIENT_SECRET=$COMMERCE_SECRET
            JAVA_OPTS_APPEND=-Xms256m -Xmx640m
            EOF

            # 3. Jalankan container Keycloak
            docker compose --project-name $PROJECT_NAME up -d --force-recreate

            # 4. Request SSL Certbot jika belum ada
            if [ ! -d "/var/www/RASA/INFRA/certbot/conf/live/$DOMAIN" ]; then
              cat > $PROXY_CONF <<EOF
            server {
                listen 80;
                server_name $DOMAIN;
                location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
                location / { return 301 https://\$host\$request_uri; }
            }
            EOF

              docker exec rasa-shared-proxy nginx -s reload

              docker run --rm \
                -v "/var/www/RASA/INFRA/certbot/conf:/etc/letsencrypt" \
                -v "/var/www/RASA/INFRA/certbot/www:/var/lib/letsencrypt" \
                certbot/certbot certonly --webroot \
                --webroot-path=/var/lib/letsencrypt \
                --email admin@rasagroup.global --agree-tos --no-eff-email \
                -d $DOMAIN
            fi

            # 5. Update Nginx Proxy ke HTTPS Reverse Proxy Keycloak
            cat > $PROXY_CONF <<EOF
            server {
                listen 80;
                server_name $DOMAIN;
                location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
                location / { return 301 https://\$host\$request_uri; }
            }
            server {
                listen 443 ssl;
                server_name $DOMAIN;
                ssl_certificate /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
                include /etc/nginx/conf.d/proxy_params;
                client_max_body_size 20M;
                proxy_buffer_size 128k;
                proxy_buffers 8 256k;
                proxy_busy_buffers_size 256k;
                large_client_header_buffers 4 32k;

                location / {
                    proxy_pass http://$CONTAINER_NAME:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header X-Forwarded-Host \$host;
                    proxy_set_header X-Forwarded-Port 443;
                    proxy_read_timeout 120s;
                }
            }
            EOF

            docker exec rasa-shared-proxy nginx -s reload
            echo "Deployment Rasa SSO ($DOMAIN) selesai!"
